<!doctype html><html lang="ja"><meta charset="utf-8"><title>漫画翻訳 — 番号付き切り抜き画像</title><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="debug.css"><body><div class="layout"><section class="card"><h1>番号付きの画像で翻訳</h1><p id="progress" role="status"></p><div class="runtime-status"><p id="backendStatus" role="status"></p><details><summary>GPUの詳細</summary><p id="gpuStatus"></p></details></div><section id="debugStatus" aria-labelledby="debug-title" hidden></section><button id="exportDebug" class="secondary" hidden>診断JSONを保存</button><p id="cacheStatus" role="status"></p><button id="clearCache" class="secondary">保存済みの画像・検出キャッシュを削除</button><button id="retry" class="secondary" hidden>文字検出を再開</button><p>端末内で文字の位置だけを検出し、原文の読み取りと翻訳は選択したAIに依頼します。各画像は文字の大きさを保てる範囲でまとめます。</p><button id="open" disabled>選択したAIを開く</button><section id="editorTools" hidden><button id="saveEdits" class="secondary" disabled>選択・位置修正を保存して画像を作り直す</button><div id="ocrList" style="max-height:600px;overflow:auto"></div><h2>検出漏れを追加</h2><p>元画像の番号とピクセル座標で、切り抜く範囲を追加できます。</p><label>画像番号 <input id="addImage" type="number" min="1" value="1"></label><div id="addCoords"><label>左 <input id="addX" type="number" value="0" min="0"></label><label>上 <input id="addY" type="number" value="0" min="0"></label><label>幅 <input id="addW" type="number" value="300" min="10"></label><label>高さ <input id="addH" type="number" value="150" min="8"></label></div><button id="showSource" class="secondary" disabled>元画像を見る</button><button id="add" class="secondary" disabled>指定範囲を追加する</button><canvas id="preview" hidden></canvas></section><button id="discard" class="secondary">この翻訳を破棄</button></section><section class="card"><h2>今回AIへ送る画像</h2><img id="atlas" style="width:100%;height:auto" alt="番号付きの原文画像"><button id="download" disabled>画像を保存（手動添付用）</button><button id="copyImage" disabled>画像をコピー</button><h2>翻訳依頼文</h2><textarea id="prompt" readonly></textarea><button id="copy" disabled>依頼文をコピー</button><h2>翻訳結果の取り込み</h2><p>AI側で自動実行するか、返答のJSON全体をここに貼り付けてください。</p><textarea id="result" placeholder="番号付き画像の翻訳JSON"></textarea><button id="apply" disabled>訳文で原文を置き換える</button><p id="status" role="status"></p><small>読み落としや誤訳は起こり得ます。切り抜きが文字全体を含むか確認してください。吹き出し外の文字も初期状態で選択されます。不要な領域はチェックを外してください。</small></section></div><script src="vendor/ort/ort.wasm.min.js"></script><script src="core.js"></script><script src="text-core.js"></script><script src="collage-core.js"></script><script src="detector.js"></script><script src="batch-store.js"></script><script src="performance-core.js"></script><script src="episode-cache.js"></script><script src="debug-core.js"></script><script src="debug-ui.js"></script><script src="ui-i18n.js"></script><script src="color-core.js"></script><script src="region-image.js"></script><script src="review.js"></script><script src="pi-client.js"></script></body></html>
