<!doctype html><html lang="ja"><meta charset="utf-8"><title>TFLite推論ベンチマーク</title><link rel="stylesheet" href="ui.css"><body><main class="card" style="max-width:850px;margin:auto"><h1>TFLite推論ベンチマーク</h1><p>画像を1枚選び、同じ入力でウォームアップ後に5回測定します。AIへの送信は行いません。</p><label>実行先<select id="accelerator"><option value="webgpu">WebGPU</option><option value="wasm">CPU</option></select></label><label>GPU精度<select id="precision"><option value="auto">自動（AMD RDNA3は部分FP16）</option><option value="fp32">FP32</option><option value="fp16">部分FP16（AMD RDNA3）</option><option value="fp16-full">全体FP16（AMD／NVIDIA・速度優先）</option><option value="tensor-fp16">FP16 Tensor Core（実験・高速化未確認）</option><option value="tensor-int8">部分INT8 Tensor Core（実験・速度優先）</option></select></label><label>画像<input id="file" type="file" accept="image/*"></label><button id="run">測定する</button><button id="save" disabled>診断JSONを保存</button><pre id="status" style="white-space:pre-wrap"></pre></main><script src="benchmark.js"></script></body></html>
